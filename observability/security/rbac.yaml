apiVersion: v1
kind: ServiceAccount
metadata:
  name: trivy-scanner
  namespace: observability
  labels:
    app.kubernetes.io/part-of: ecom
    eci.phase: "6"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: trivy-scanner-role
  labels:
    app.kubernetes.io/part-of: ecom
    eci.phase: "6"
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "namespaces"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trivy-scanner-binding
  labels:
    app.kubernetes.io/part-of: ecom
    eci.phase: "6"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: trivy-scanner-role
subjects:
  - kind: ServiceAccount
    name: trivy-scanner
    namespace: observability
