apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: observability
  labels:
    grafana_dashboard_provider: "1"
    app.kubernetes.io/part-of: ecom
    eci.phase: "6"
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'ecom-platform'
        orgId: 1
        folder: 'E-Commerce Platform'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/ecom
