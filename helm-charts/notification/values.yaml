# helm-charts/notification/values.yaml — Phase 4 production chart.
# CI owns only image.repository + image.tag (2-space indentation must stay).
# ArgoCD syncs on tag bump. Do NOT hand-edit image.* — pipeline bumps it.

replicaCount: 2

image:
  repository: docker.io/mylab12345/ecom-notification
  tag: "0.0.0+phase1-placeholder"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8008
  targetPort: 8008
  annotations: {}

containerPort: 8008

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

podLabels: {}
podAnnotations: {}
commonLabels: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  readiness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 6
  liveness:
    path: /health
    initialDelaySeconds: 25
    periodSeconds: 20
    failureThreshold: 6

metrics:
  enabled: true
  path: /metrics
  port: 8008

config:
  SERVICE_NAME: "notification-service"
  LOG_LEVEL: "info"
  RABBITMQ_SECRET_REF: "ecom-rabbitmq"
  SMTP_SECRET_REF: "ecom-smtp"
  DATABASE_URL: "postgresql://ecom:ecom123@postgres:5432/notification_db"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"

extraConfig: {}
extraEnv: []
envSecrets: []

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

scheduling:
  architecture: arm64
  spotCapable: true
  priorityClass: ecom-best-effort

nodeSelector: {}
tolerations: []
topologySpreadConstraints: []

ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: ecom.local
      paths:
        - path: /api/notifications(|$)(.*)
          pathType: Prefix
  tls: []

networkPolicy:
  enabled: true
  extraIngress: []
  extraEgress: []

serviceMonitor:
  enabled: false
