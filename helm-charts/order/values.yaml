# helm-charts/order/values.yaml — Phase 4 production chart.
# CI owns only image.repository + image.tag (2-space indentation must stay).
# ArgoCD syncs on tag bump. Do NOT hand-edit image.* — pipeline bumps it.

replicaCount: 2

image:
  repository: docker.io/mylab12345/ecom-order
  tag: "0.0.0+phase1-placeholder"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8005
  targetPort: 8005
  annotations: {}

containerPort: 8005

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

podLabels: {}
podAnnotations: {}
commonLabels: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  readiness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 6
  liveness:
    path: /health
    initialDelaySeconds: 25
    periodSeconds: 20
    failureThreshold: 6

metrics:
  enabled: true
  path: /metrics
  port: 8005

config:
  SERVICE_NAME: "order-service"
  LOG_LEVEL: "info"
  DOWNSTREAM: "product,inventory,payment,cart,shipping,notification"
  RESERVATION_TTL_SECONDS: "900"
  DATABASE_URL: "postgresql://ecom:ecom123@postgres:5432/order_db"
  PRODUCT_SERVICE_URL: "http://product:8002"
  INVENTORY_SERVICE_URL: "http://inventory:8003"
  PAYMENT_SERVICE_URL: "http://payment:8006"
  CART_SERVICE_URL: "http://cart:8004"
  SHIPPING_SERVICE_URL: "http://shipping:8007"
  NOTIFICATION_SERVICE_URL: "http://notification:8008"

extraConfig: {}
extraEnv: []
envSecrets: []

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

scheduling:
  architecture: arm64
  spotCapable: false
  priorityClass: ecom-critical

nodeSelector: {}
tolerations: []
topologySpreadConstraints: []

ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: ecom.local
      paths:
        - path: /api/orders(|$)(.*)
          pathType: Prefix
  tls: []

networkPolicy:
  enabled: true
  extraIngress: []
  extraEgress: []

serviceMonitor:
  enabled: false
