{{- if and .Values.enabled .Values.defaultDeny.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "network-policies.fullname" . }}-default-deny
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "network-policies.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    {{- toYaml .Values.defaultDeny.policyTypes | nindent 4 }}
{{- end }}
