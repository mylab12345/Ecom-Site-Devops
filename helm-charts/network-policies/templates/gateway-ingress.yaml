{{- if and .Values.enabled .Values.gateway.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "network-policies.fullname" . }}-gateway-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "network-policies.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/component: controller
        - namespaceSelector:
            matchLabels:
              name: {{ .Values.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: gateway
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16
      ports:
        - protocol: TCP
          port: {{ .Values.gateway.port }}
{{- end }}
