apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecom-ingress-nginx
  namespace: argocd
  labels:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/part-of: ecom
    eci.service: ingress-nginx
    eci.phase: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ecom
  source:
    repoURL: https://github.com/mylab12345/Ecom-Site-Devops.git
    targetRevision: gitops/main
    path: helm-charts/ingress-nginx
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
